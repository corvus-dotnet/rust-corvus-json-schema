[package]
name = "bowtie-rust-corvus-json-schema"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Bowtie (https://github.com/bowtie-json-schema/bowtie) harness for corvus-json-schema"

[dependencies]
# The implementation under test: Dependabot keeps it (and Cargo.lock) at the latest release.
corvus-json-schema = "0.1.3"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
lto = "fat"
